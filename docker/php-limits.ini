; imgsli upload limits. Both values are rendered at container start
; (docker/entrypoint.sh) from UPLOAD_MAX_IMAGES / UPLOAD_MAX_IMAGE_BYTES:
; upload_max_filesize: app per-image cap + 2 MiB headroom, so oversized
; files keep their true size for the app's validation (422) instead of
; being silently truncated to a size that would pass.
; post_max_size: max_images x per-image cap + multipart overhead.
upload_max_filesize = __UPLOAD_MAX__
post_max_size = __POST_MAX__
