server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # __MAX_BODY__ is rendered at container start (docker/entrypoint.sh) from
    # the higher of the regular/admin image counts and per-image byte caps so
    # it tracks the app caps.
    client_max_body_size __MAX_BODY__;

    # Uploaded images are served from this origin; never let a browser sniff a
    # second type out of them, and do not leak album URLs to third parties.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
