# nginx logs live in the container's writable layer; without rotation they
# grow unbounded. cron runs /etc/cron.daily/logrotate (logrotate package).
/var/log/nginx/access.log /var/log/nginx/error.log {
    size 10M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
